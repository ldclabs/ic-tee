name: Dockers
on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'Docker image tag'
        required: true
        type: string
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ldclabs/ic_tee_nitro_gateway
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      env:
        BUILD_TAG: ${{ inputs.build_tag }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        printf '%s\n' "$GHCR_TOKEN" | docker login --username "$GITHUB_ACTOR" --password-stdin "$REGISTRY"
        IMAGE="$REGISTRY/${IMAGE_NAME}_enclave_amd64"
        docker build -f nitro_enclave/amd64.Dockerfile -t "$IMAGE:$BUILD_TAG" -t "$IMAGE:latest" --push .
