name: Test
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          rustup update --no-self-update stable
          rustup target add wasm32-unknown-unknown
          cargo clippy --verbose --all-targets --all-features
          cargo test --verbose --workspace --all-features -- --nocapture
          RUSTFLAGS="--cfg=getrandom_backend=\"custom\"" cargo build --target wasm32-unknown-unknown --release --locked -p ic_tee_identity_canister
