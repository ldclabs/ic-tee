name: Test
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          rustup update --no-self-update stable
          rustup target add wasm32-unknown-unknown
          make lint test build-wasm
