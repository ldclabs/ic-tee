name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Build canisters
      run: |
        rustup update --no-self-update stable
        rustup target add wasm32-unknown-unknown
        cargo install ic-wasm --version 0.11.1 --locked
        BINARYEN_VERSION="version_131"
        BINARYEN_ARCHIVE="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
        BINARYEN_DIR="$(mktemp -d)"
        curl --fail --location --retry 3 \
          --output "$BINARYEN_DIR/$BINARYEN_ARCHIVE" \
          "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$BINARYEN_ARCHIVE"
        echo "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db  $BINARYEN_DIR/$BINARYEN_ARCHIVE" | sha256sum --check --strict
        tar -xzf "$BINARYEN_DIR/$BINARYEN_ARCHIVE" -C "$BINARYEN_DIR"
        WASM_OPT="$BINARYEN_DIR/binaryen-$BINARYEN_VERSION/bin/wasm-opt"
        ic-wasm --version
        "$WASM_OPT" --version
        mkdir -p out
        make build-wasm
        for CAN in ic_tee_identity_canister
        do
          cp "target/wasm32-unknown-unknown/release/$CAN.wasm" out/
          cp "src/$CAN/$CAN.did" "out/$CAN.did"
          WASM="out/$CAN.wasm"
          ic-wasm "$WASM" -o "$WASM" metadata candid:service -f "out/$CAN.did" -v public
          ic-wasm "$WASM" -o "$WASM" shrink
          "$WASM_OPT" \
            -O3 \
            --enable-mutable-globals \
            --enable-nontrapping-float-to-int \
            --enable-simd \
            --enable-bulk-memory \
            --enable-sign-ext \
            --enable-reference-types \
            --enable-memory64 \
            --enable-multivalue \
            --enable-tail-call \
            --inline-functions-with-loops \
            "$WASM" -o "$WASM.optimized"
          mv "$WASM.optimized" "$WASM"
          gzip -n "$WASM"
          SHA256="$(sha256sum < "out/$CAN.wasm.gz" | sed 's/ .*$//g')"
          echo "$SHA256" > "out/$CAN.wasm.gz.$SHA256.txt"
        done
        ls -lah out
    - name: Upload wasm artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wasm-artifacts
        path: out/*
  build-binary:
    runs-on: ubuntu-latest
    container: clux/muslrust:1.86.0-stable
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Build linux binary
      run: |
        mkdir -p out
        rustup update --no-self-update stable
        rustup target add x86_64-unknown-linux-musl
        export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-s"
        for PACK in ic_tee_nitro_gateway ic_tee_host_daemon ic_tee_daemon ic_tee_cli
        do
          cargo build --release --locked -p "$PACK" --target x86_64-unknown-linux-musl
          cp "target/x86_64-unknown-linux-musl/release/$PACK" "out/"
          SHA256="$(sha256sum < "out/$PACK" | sed 's/ .*$//g')"
          echo "$SHA256" > "out/$PACK.$SHA256.txt"
        done
        ls -lah out
    - name: Upload binary artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binary-artifacts
        path: out/*
  release:
    runs-on: ubuntu-latest
    needs: [build-wasm, build-binary]
    permissions:
      contents: write
    steps:
    - name: Download wasm artifacts
      uses: actions/download-artifact@v4
      with:
        name: wasm-artifacts
        path: out-wasm
    - name: Download binary artifacts
      uses: actions/download-artifact@v4
      with:
        name: binary-artifacts
        path: out-binary
    - name: Get release tag
      id: get_tag
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          git check-ref-format "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        fi
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_tag.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: Release ${{ steps.get_tag.outputs.tag }}
        draft: ${{ github.event_name == 'workflow_dispatch' }}
        files: |
          out-wasm/*
          out-binary/*
